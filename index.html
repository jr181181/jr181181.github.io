<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JR 18 11.81 – BTC Orderbuch-Wände</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--y:#ffd400;--b:#2f6bff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}header{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}h1{font-size:15px;margin:0}#price{font-weight:700;font-size:16px}.grp{display:flex;gap:4px;flex-wrap:wrap}button{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}button.on{border-color:var(--y);color:var(--y)}label{display:flex;align-items:center;gap:4px;color:var(--mut)}#info{padding:5px 12px;color:var(--mut);font-size:12px;min-height:26px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}.bar{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--b),var(--y));vertical-align:middle}#wrap{position:relative;flex:1;min-height:320px}#chart,#ov{position:absolute;inset:0}#ov{pointer-events:none}.chip{display:flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}.chip.on{color:var(--tx);border-color:var(--y)}.dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block}.dot.ok{background:#26a69a}.dot.bad{background:#ef5350}#exrow{padding:6px 12px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header><h1>JR 18 11.81 · BTC</h1><span id="price">–</span><div class="grp" id="tf"></div><div class="grp"><label><input type="checkbox" id="spot" checked>Spot</label><label><input type="checkbox" id="fut" checked>Futures</label><label><input type="checkbox" id="ls" checked>Long/Short</label></div></header>
<div id="exrow" class="grp"></div>
<div id="info"><span>Wände: klein <span class="bar"></span> groß (blau → gelb)</span><span>Linie links: <b style="color:#26a69a">grün = Kauf</b> / <b style="color:#ef5350">rot = Verkauf</b></span><span id="hover"></span><span id="status"></span></div>
<div id="wrap"><div id="chart"></div><canvas id="ov"></canvas></div>
<script>
const SPOT="https://api.binance.com",FUT="https://fapi.binance.com",SYM="BTCUSDT";const TFS={"15m":"15m","1h":"1h","4h":"4h","1d":"1d","1w":"1w","1M":"1M","3M":"4h"},LSP={"15m":"15m","1h":"1h","4h":"4h","1d":"1d","1w":"1d","1M":"1d","3M":"4h"};let tf="1h",book={},ver=0,lastSig="",lastBucket=0,cache=[];const N=(b,a,m=1)=>({bids:b.map(x=>[+x[0],+x[1]*m]),asks:a.map(x=>[+x[0],+x[1]*m])});const GP=x=>x.map(o=>[o.p,o.s]);
const EX={Binance:{spot:()=>j(`${SPOT}/api/v3/depth?symbol=${SYM}&limit=5000`).then(d=>N(d.bids,d.asks)),fut:()=>j(`${FUT}/fapi/v1/depth?symbol=${SYM}&limit=1000`).then(d=>N(d.bids,d.asks))},Bybit:{spot:()=>j("https://api.bybit.com/v5/market/orderbook?category=spot&symbol=BTCUSDT&limit=200").then(d=>N(d.result.b,d.result.a)),fut:()=>j("https://api.bybit.com/v5/market/orderbook?category=linear&symbol=BTCUSDT&limit=500").then(d=>N(d.result.b,d.result.a))},OKX:{spot:()=>j("https://www.okx.com/api/v5/market/books?instId=BTC-USDT&sz=400").then(d=>N(d.data[0].bids,d.data[0].asks)),fut:()=>j("https://www.okx.com/api/v5/market/books?instId=BTC-USDT-SWAP&sz=400").then(d=>N(d.data[0].bids,d.data[0].asks,.01))},Bitget:{spot:()=>j("https://api.bitget.com/api/v2/spot/market/orderbook?symbol=BTCUSDT&type=step0&limit=150").then(d=>N(d.data.bids,d.data.asks)),fut:()=>j("https://api.bitget.com/api/v2/mix/market/merge-depth?productType=usdt-futures&symbol=BTCUSDT&limit=100").then(d=>N(d.data.bids,d.data.asks))},Gate:{spot:()=>j("https://api.gateio.ws/api/v4/spot/order_book?currency_pair=BTC_USDT&limit=100").then(d=>N(d.bids,d.asks)),fut:()=>j("https://api.gateio.ws/api/v4/futures/usdt/order_book?contract=BTC_USDT&limit=100").then(d=>N(GP(d.bids),GP(d.asks),.0001))},Coinbase:{spot:()=>j("https://api.exchange.coinbase.com/products/BTC-USD/book?level=2").then(d=>N(d.bids,d.asks))},MEXC:{spot:()=>j("https://api.mexc.com/api/v3/depth?symbol=BTCUSDT&limit=1000").then(d=>N(d.bids,d.asks))},KuCoin:{spot:()=>j("https://api.kucoin.com/api/v1/market/orderbook/level2_100?symbol=BTC-USDT").then(d=>N(d.data.bids,d.data.asks))},Kraken:{spot:()=>j("https://api.kraken.com/0/public/Depth?pair=XBTUSD&count=500").then(d=>{const r=Object.values(d.result)[0];return N(r.bids,r.asks)})},Deribit:{fut:()=>j("https://www.deribit.com/api/v2/public/get_order_book?instrument_name=BTC-PERPETUAL&depth=1000").then(d=>{const c=a=>a.map(x=>[x[0],x[1]/x[0]]);return N(c(d.result.bids),c(d.result.asks))})}};
const on={},ok={};Object.keys(EX).forEach(k=>on[k]=true);const wrap=document.getElementById("wrap"),ov=document.getElementById("ov"),ctx=ov.getContext("2d");const chart=LightweightCharts.createChart(document.getElementById("chart"),{layout:{background:{color:"#0d1117"},textColor:"#8b949e"},grid:{vertLines:{color:"#1b222c"},horzLines:{color:"#1b222c"}},rightPriceScale:{borderColor:"#30363d"},timeScale:{borderColor:"#30363d",timeVisible:true,rightOffset:6},crosshair:{mode:0},handleScroll:true,handleScale:true});const candles=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350"});candles.priceScale().applyOptions({scaleMargins:{top:.05,bottom:.3}});const lsLine=chart.addLineSeries({priceScaleId:"ls",color:"#b388ff",lineWidth:2,title:"L/S Binance",priceFormat:{type:"price",precision:2,minMove:.01}}),lsBy=chart.addLineSeries({priceScaleId:"ls",color:"#ffa94d",lineWidth:1,title:"L/S Bybit",priceFormat:{type:"price",precision:2,minMove:.01}});chart.priceScale("ls").applyOptions({scaleMargins:{top:.78,bottom:.02},borderColor:"#30363d"});
function resize(){const r=wrap.getBoundingClientRect(),d=devicePixelRatio||1;chart.resize(r.width,r.height);ov.width=r.width*d;ov.height=r.height*d;ov.style.width=r.width+"px";ov.style.height=r.height+"px";ctx.setTransform(d,0,0,d,0,0);lastSig=""}addEventListener("resize",resize);async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}const st=t=>document.getElementById("status").textContent=t;
async function loadHistory(){try{st("Lade Daten …");const k=await j(`${SPOT}/api/v3/klines?symbol=${SYM}&interval=${TFS[tf]}&limit=1000`);candles.setData(k.map(x=>({time:x[0]/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]})));try{const l=await j(`${FUT}/futures/data/globalLongShortAccountRatio?symbol=${SYM}&period=${LSP[tf]}&limit=500`);lsLine.setData(l.map(x=>({time:Math.floor(x.timestamp/1000),value:+x.longShortRatio})))}catch(e){lsLine.setData([])}try{const bp=LSP[tf].replace("m","min"),l=await j(`https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=${SYM}&period=${bp}&limit=500`);lsBy.setData(l.result.list.map(x=>({time:Math.floor(+x.timestamp/1000),value:+x.buyRatio/+x.sellRatio})).sort((a,b)=>a.time-b.time))}catch(e){lsBy.setData([])}if(tf=== "3M")chart.timeScale().setVisibleRange({from:Math.floor(Date.now()/1000)-90*86400,to:Math.floor(Date.now()/1000)+2*86400});else chart.timeScale().fitContent();st("")}catch(e){st("Fehler beim Laden (Binance evtl. blockiert)")}}
async function loadBook(){const jobs=[];for(const[ex,m]of Object.entries(EX))for(const[mk,fn]of Object.entries(m))jobs.push(fn().then(r=>{book[ex+":"+mk]=r;ok[ex]=true}).catch(()=>{ok[ex]=ok[ex]||false}));await Promise.all(jobs);ver++;paintChips();const s=book["Binance:spot"];if(s)document.getElementById("price").textContent="$ "+((s.bids[0][0]+s.asks[0][0])/2).toLocaleString("de-DE",{maximumFractionDigits:1})}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}function buckets(step){const out=new Map(),add=(arr,side)=>{for(const[pr,q]of arr){const key=side+Math.floor(pr/step),o=out.get(key)||{p:Math.floor(pr/step)*step,v:0,side};o.v+=q;out.set(key,o)}};for(const[k,v]of Object.entries(book)){const[ex,mk]=k.split(":");if(!on[ex]||(mk==="spot"?!spot.checked:!fut.checked))continue;add(v.bids,"b");add(v.asks,"s")}return [...out.values()]}function mix(t){const a=[47,107,255],b=[255,212,0];return a.map((c,i)=>Math.round(c+(b[i]-c)*t))}
function draw(){requestAnimationFrame(draw);const w=ov.clientWidth,h=ov.clientHeight,top=candles.coordinateToPrice(0),bot=candles.coordinateToPrice(h*.7);if(top==null||bot==null||!Object.keys(book).length)return;const sig=[w,h,top.toFixed(1),bot.toFixed(1),ver,spot.checked,fut.checked,Object.values(on).join("")].join("|");if(sig===lastSig)return;lastSig=sig;const step=niceStep(Math.abs(top-bot)/70);if(step!==lastBucket||sig.indexOf("|"+ver+"|")>-1){cache=buckets(step);lastBucket=step}ctx.clearRect(0,0,w,h);const vis=cache.filter(b=>b.p+step>=bot&&b.p<=top);if(!vis.length)return;const max=Math.max(...vis.map(b=>b.v)),chartW=w-chart.priceScale("right").width();for(const b of vis){const y1=candles.priceToCoordinate(b.p+step),y2=candles.priceToCoordinate(b.p);if(y1==null||y2==null)continue;const t=Math.sqrt(b.v/max),[r,g,bl]=mix(t),hh=Math.max(2,y2-y1-1);ctx.fillStyle=`rgba(${r},${g},${bl},${.18+.55*t})`;ctx.fillRect(0,y1,chartW,hh);ctx.fillStyle=b.side==="b"?"#26a69a":"#ef5350";ctx.fillRect(0,y1,4,hh);if(t>.45&&hh>9){ctx.fillStyle="#fff";ctx.font="11px system-ui";ctx.fillText(b.v.toFixed(0)+" BTC",8,y1+hh/2+4)}}}
chart.subscribeCrosshairMove(p=>{const el=document.getElementById("hover");if(!p.point||!cache.length){el.textContent="";return}const pr=candles.coordinateToPrice(p.point.y),b=cache.find(x=>pr>=x.p&&pr<x.p+lastBucket);el.textContent=b?`${b.side==="b"?"Kauf":"Verkauf"}wand $${b.p.toLocaleString("de-DE")} · ${b.v.toFixed(1)} BTC · ≈ $${Math.round(b.v*b.p).toLocaleString("de-DE")}`:""});const tfBox=document.getElementById("tf");Object.keys(TFS).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{tf=k;[...tfBox.children].forEach(c=>c.classList.toggle("on",c===b));loadHistory()};if(k===tf)b.classList.add("on");tfBox.appendChild(b)});document.getElementById("ls").onchange=e=>{lsLine.applyOptions({visible:e.target.checked});lsBy.applyOptions({visible:e.target.checked})};const spot=document.getElementById("spot"),fut=document.getElementById("fut");const row=document.getElementById("exrow"),chips={};Object.keys(EX).forEach(k=>{const c=document.createElement("span");c.className="chip on";c.title=Object.keys(EX[k]).map(m=>m=== "spot"?"Spot":"Futures").join(" + ");c.innerHTML=`<i class="dot"></i>${k}`;c.onclick=()=>{on[k]=!on[k];c.classList.toggle("on",on[k]);lastSig=""};row.appendChild(c);chips[k]=c});function paintChips(){for(const k in chips)chips[k].firstChild.className="dot "+(ok[k]===true?"ok":ok[k]===false?"bad":"")}
resize();loadHistory();loadBook();draw();setInterval(loadBook,10000);setInterval(()=>{if(tf==="15m"||tf==="1h")loadHistory()},300000);
</script>
</body>
</html>
