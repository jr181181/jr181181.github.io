<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JR 18 11.81 – BTC Orderbuch-Wände</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--y:#ffd400;--b:#2f6bff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
header{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0}
#price{font-weight:700;font-size:16px}
.grp{display:flex;gap:4px 6px;flex-wrap:wrap}
button{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}
button.on{border-color:var(--y);color:var(--y)}
label{display:flex;align-items:center;gap:4px;color:var(--mut)}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
.chip.on{color:var(--tx);border-color:var(--y)}
.dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block}.dot.ok{background:#26a69a}.dot.bad{background:#ef5350}
#exrow{padding:6px 12px;border-bottom:1px solid var(--line)}
#info{padding:5px 12px;color:var(--mut);font-size:12px;min-height:26px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.bar{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--b),var(--y));vertical-align:middle}
#wrap{position:relative;height:58vh;min-height:320px}
#wrap2{position:relative;height:42vh;min-height:250px}
#chart,#ov,#chart2,#ov2{position:absolute;inset:0}
#ov,#ov2{pointer-events:none}
#info2{padding:6px 12px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>JR 18 11.81 · BTC</h1>
  <span id="price">–</span>
  <div class="grp" id="tf"></div>
  <div class="grp">
    <label><input type="checkbox" id="spot" checked>Spot</label>
    <label><input type="checkbox" id="fut" checked>Futures</label>
    <label><input type="checkbox" id="ls" checked>Long/Short</label>
    <label title="Preisachse auf den Bereich des Orderbuchs zoomen"><input type="checkbox" id="fok" checked>Fokus Wände</label>
  </div>
</header>
<div id="exrow" class="grp"></div>
<div id="info">
  <span>Wände: klein <span class="bar"></span> groß (blau → gelb)</span>
  <span>Marker: <b style="color:#26a69a">grün = Kauf</b> / <b style="color:#ef5350">rot = Verkauf</b></span>
  <span id="lsl"></span>
  <span id="hover"></span>
  <span id="status"></span>
</div>
<div id="wrap"><div id="chart"></div><canvas id="ov"></canvas></div>
<div id="info2">
  <b style="color:var(--tx)">Liquidation Map</b>
  <span>Heat: klein <span class="bar"></span> groß (blau → gelb) · Longs liegen unter, Shorts über dem Preis</span>
  <span>Modell-Schätzung aus Kerzen, Volumen, Open Interest und Long/Short, keine Börsen-Rohdaten</span>
  <span id="liqhover"></span>
</div>
<div id="wrap2"><div id="chart2"></div><canvas id="ov2"></canvas></div>

<script>
const SPOT="https://api.binance.com", FUT="https://fapi.binance.com", SYM="BTCUSDT";
const TFS={ "15m":"15m","1h":"1h","4h":"4h","1d":"1d","1w":"1w","1M":"1M","3M":"4h" };
const LSP={ "15m":"15m","1h":"1h","4h":"4h","1d":"1d","1w":"1d","1M":"1d","3M":"4h" };
const $=id=>document.getElementById(id);
const spot=$("spot"),fut=$("fut"),fok=$("fok"),st=t=>$("status").textContent=t;
let tf="1h", book={}, ver=0, lastSig="", lastStep=1, cache=[], nBars=0, focusR=null, firstBook=false;
let bars=[], tIdx=new Map(), liq=null, oi=null, lsRatio=null, liqVer=0, lastSig2="";

async function j(u){const r=await fetch(u,{signal:AbortSignal.timeout(9000)});if(!r.ok)throw new Error(r.status);return r.json()}
const N=(b,a,m=1)=>({bids:b.map(x=>[+x[0],+x[1]*m]),asks:a.map(x=>[+x[0],+x[1]*m])});
const GP=x=>x.map(o=>[o.p,o.s]);

// Top-10-Börsen – Mengen in BTC umgerechnet. Eintrag löschen/ergänzen = Liste ändern.
const EX={
 Binance:{spot:()=>j(`${SPOT}/api/v3/depth?symbol=${SYM}&limit=5000`).then(d=>N(d.bids,d.asks)),
          fut:()=>j(`${FUT}/fapi/v1/depth?symbol=${SYM}&limit=1000`).then(d=>N(d.bids,d.asks))},
 Bybit:{spot:()=>j("https://api.bybit.com/v5/market/orderbook?category=spot&symbol=BTCUSDT&limit=200").then(d=>N(d.result.b,d.result.a)),
        fut:()=>j("https://api.bybit.com/v5/market/orderbook?category=linear&symbol=BTCUSDT&limit=500").then(d=>N(d.result.b,d.result.a))},
 OKX:{spot:()=>j("https://www.okx.com/api/v5/market/books?instId=BTC-USDT&sz=400").then(d=>N(d.data[0].bids,d.data[0].asks)),
      fut:()=>j("https://www.okx.com/api/v5/market/books?instId=BTC-USDT-SWAP&sz=400").then(d=>N(d.data[0].bids,d.data[0].asks,0.01))},
 Bitget:{spot:()=>j("https://api.bitget.com/api/v2/spot/market/orderbook?symbol=BTCUSDT&type=step0&limit=150").then(d=>N(d.data.bids,d.data.asks)),
         fut:()=>j("https://api.bitget.com/api/v2/mix/market/merge-depth?productType=usdt-futures&symbol=BTCUSDT&limit=100").then(d=>N(d.data.bids,d.data.asks))},
 Gate:{spot:()=>j("https://api.gateio.ws/api/v4/spot/order_book?currency_pair=BTC_USDT&limit=100").then(d=>N(d.bids,d.asks)),
       fut:()=>j("https://api.gateio.ws/api/v4/futures/usdt/order_book?contract=BTC_USDT&limit=100").then(d=>N(GP(d.bids),GP(d.asks),0.0001))},
 Coinbase:{spot:()=>j("https://api.exchange.coinbase.com/products/BTC-USD/book?level=2").then(d=>N(d.bids,d.asks))},
 MEXC:{spot:()=>j("https://api.mexc.com/api/v3/depth?symbol=BTCUSDT&limit=1000").then(d=>N(d.bids,d.asks))},
 KuCoin:{spot:()=>j("https://api.kucoin.com/api/v1/market/orderbook/level2_100?symbol=BTC-USDT").then(d=>N(d.data.bids,d.data.asks))},
 Kraken:{spot:()=>j("https://api.kraken.com/0/public/Depth?pair=XBTUSD&count=500").then(d=>{const r=Object.values(d.result)[0];return N(r.bids,r.asks)})},
 Deribit:{fut:()=>j("https://www.deribit.com/api/v2/public/get_order_book?instrument_name=BTC-PERPETUAL&depth=1000").then(d=>{
          const c=a=>a.map(x=>[x[0],x[1]/x[0]]);return N(c(d.result.bids),c(d.result.asks))})}
};
const on={}, ok={};Object.keys(EX).forEach(k=>on[k]=true);

// Long/Short Ratio: alle Börsen mit öffentlicher Futures-Statistik. [Farbe, Abruf(period) -> [[sek, ratio],...]]
const OKXP={"15m":"5m","1h":"1H","4h":"1H","1d":"1D"};
const LSX={
 Binance:["#b388ff",async p=>(await j(`${FUT}/futures/data/globalLongShortAccountRatio?symbol=${SYM}&period=${p}&limit=500`)).map(x=>[x.timestamp/1000,+x.longShortRatio])],
 Bybit:["#ffa94d",async p=>(await j(`https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=${SYM}&period=${p.replace("m","min")}&limit=500`)).result.list.map(x=>[+x.timestamp/1000,+x.buyRatio/+x.sellRatio])],
 OKX:["#4dd0e1",async p=>(await j(`https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=${OKXP[p]}`)).data.map(x=>[+x[0]/1000,+x[1]])],
 Bitget:["#81c784",async p=>{const d=(await j(`https://api.bitget.com/api/v3/market/futures-long-short?symbol=${SYM}&period=${p}`)).data;return (Array.isArray(d)?d:(d&&d.list)||[]).map(x=>[+x.ts/1000,+x.longShortRatio])}],
 Gate:["#f06292",async p=>(await j(`https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=BTC_USDT&interval=${p}&limit=500`)).map(x=>[+x.time,+x.lsr_account])]
};

const wrap=$("wrap"), ov=$("ov"), ctx=ov.getContext("2d");
const chart=LightweightCharts.createChart($("chart"),{
  layout:{background:{color:"#0d1117"},textColor:"#8b949e"},
  grid:{vertLines:{color:"#1b222c"},horzLines:{color:"#1b222c"}},
  rightPriceScale:{borderColor:"#30363d",minimumWidth:72},
  timeScale:{borderColor:"#30363d",timeVisible:true,rightOffset:6},
  crosshair:{mode:0}, handleScroll:true, handleScale:true
});
const candles=chart.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350",
  autoscaleInfoProvider:o=>{const r=o();return (fok.checked&&focusR&&r)?{priceRange:{minValue:focusR[0],maxValue:focusR[1]}}:r}});
candles.priceScale().applyOptions({scaleMargins:{top:0.05,bottom:0.3}});
const lsS={},lsOk={};
for(const [k,[c]] of Object.entries(LSX))
  lsS[k]=chart.addLineSeries({priceScaleId:"ls",color:c,lineWidth:k=== "Binance"?2:1,lastValueVisible:false,priceLineVisible:false,priceFormat:{type:"price",precision:2,minMove:0.01}});
chart.priceScale("ls").applyOptions({scaleMargins:{top:0.78,bottom:0.02},borderColor:"#30363d"});

const ov2=$("ov2"), ctx2=ov2.getContext("2d");
const chart2=LightweightCharts.createChart($("chart2"),{
  layout:{background:{color:"#0d1117"},textColor:"#8b949e"},
  grid:{vertLines:{color:"#1b222c"},horzLines:{color:"#1b222c"}},
  rightPriceScale:{borderColor:"#30363d",minimumWidth:72},
  timeScale:{borderColor:"#30363d",timeVisible:true,rightOffset:6},
  crosshair:{mode:0}, handleScroll:true, handleScale:true
});
const line2=chart2.addLineSeries({color:"#e6edf3",lineWidth:1,priceLineVisible:true,priceFormat:{type:"price",precision:1,minMove:0.1},
  autoscaleInfoProvider:o=>{const r=o();if(!r)return r;const m=(r.priceRange.minValue+r.priceRange.maxValue)/2;
    return{priceRange:{minValue:r.priceRange.minValue-m*0.08,maxValue:r.priceRange.maxValue+m*0.08}}}});
let syncing=false;
const link=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(syncing||!r)return;syncing=true;try{b.timeScale().setVisibleLogicalRange(r)}catch(e){}syncing=false});
link(chart,chart2);link(chart2,chart);

function resize(){
  const d=devicePixelRatio||1;
  for(const [el,c,o,x] of [[wrap,chart,ov,ctx],[$("wrap2"),chart2,ov2,ctx2]]){
    const r=el.getBoundingClientRect(); c.resize(r.width,r.height);
    o.width=r.width*d;o.height=r.height*d;o.style.width=r.width+"px";o.style.height=r.height+"px";x.setTransform(d,0,0,d,0,0);
  }
  lastSig="";lastSig2="";
}
addEventListener("resize",resize);

function paintLS(){ $("lsl").innerHTML="Long/Short: "+Object.entries(LSX).map(([k,[c]])=>`<span style="color:${lsOk[k]===false?"#666":c};${lsOk[k]===false?"text-decoration:line-through":""}">● ${k}</span>`).join(" "); }

async function loadHistory(){
  st("Lade Daten …");
  try{
    const k=await j(`${SPOT}/api/v3/klines?symbol=${SYM}&interval=${TFS[tf]}&limit=1000`);
    bars=k.map(x=>({t:x[0]/1000,o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
    tIdx=new Map(bars.map((b,i)=>[b.t,i]));
    candles.setData(bars.map(b=>({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c})));
    line2.setData(bars.map(b=>({time:b.t,value:b.c})));nBars=bars.length;
  }catch(e){st("Kerzen nicht ladbar (Binance evtl. blockiert)");return}
  const snap=t=>{if(t<bars[0].t)return null;let lo=0,hi=bars.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(bars[m].t<=t)lo=m;else hi=m-1}return bars[lo].t};
  await Promise.all([
    ...Object.entries(LSX).map(async([k,[c,fn]])=>{
      try{
        const r=(await fn(LSP[tf])).filter(x=>isFinite(x[1])&&x[0]>0).sort((a,b)=>a[0]-b[0]);
        if(k==="Binance"&&r.length)lsRatio=r[r.length-1][1];
        const m=new Map();for(const [t,v] of r){const q=snap(t);if(q!=null)m.set(q,v)}
        lsS[k].setData([...m].map(([time,value])=>({time,value})));lsOk[k]=m.size>0;
      }catch(e){lsS[k].setData([]);lsOk[k]=false}
    }),
    j(`${FUT}/fapi/v1/openInterest?symbol=${SYM}`).then(d=>{oi=+d.openInterest}).catch(()=>{oi=null})
  ]);
  buildLiq();paintLS();view();st("");
}

function rescale(){const o=candles.priceScale();o.applyOptions({autoScale:false});o.applyOptions({autoScale:true})}
function view(){
  if(!nBars)return;
  if(fok.checked){focusR=calcFocus();rescale();chart.timeScale().setVisibleLogicalRange({from:nBars-70,to:nBars+8})}
  else{focusR=null;rescale();if(tf==="3M"){const n=Math.floor(Date.now()/1000);chart.timeScale().setVisibleRange({from:n-90*86400,to:n+86400*2})}else chart.timeScale().fitContent()}
}
function refresh(){lastSig="";if(fok.checked){focusR=calcFocus();rescale()}}

function active(){return Object.entries(book).filter(([k])=>{const [ex,mk]=k.split(":");return on[ex]&&(mk==="spot"?spot.checked:fut.checked)})}
function calcFocus(){
  const lo=[],hi=[];
  for(const [k,v] of active()){if(v.bids.length&&v.asks.length){lo.push(Math.min(...v.bids.map(x=>x[0])));hi.push(Math.max(...v.asks.map(x=>x[0])))}}
  if(!lo.length)return null;
  const med=a=>a.sort((x,y)=>x-y)[a.length>>1], s=book["Binance:spot"];
  const m=s?(s.bids[0][0]+s.asks[0][0])/2:(med(lo)+med(hi))/2;
  return [Math.min(med(lo),m*0.9985),Math.max(med(hi),m*1.0015)];
}

async function loadBook(){
  const jobs=[];
  for(const [ex,m] of Object.entries(EX))for(const [mk,fn]of Object.entries(m))jobs.push(fn().then(r=>{book[ex+":"+mk]=r;ok[ex]=true;ver++}).catch(()=>{ok[ex]=ok[ex]||false}));
  await Promise.all(jobs);ver++;paintChips();
  const s=book["Binance:spot"];
  if(s)$("price").textContent="$ "+((s.bids[0][0]+s.asks[0][0])/2).toLocaleString("de-DE",{maximumFractionDigits:1});
  if(!firstBook&&Object.keys(book).length){firstBook=true;view()}else if(fok.checked)focusR=calcFocus();
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
function buckets(step){
  const out=new Map();const add=(arr,side)=>{for(const[pr,q]of arr){const key=side+Math.floor(pr/step);const o=out.get(key)||{p:Math.floor(pr/step)*step,v:0,side};o.v+=q;out.set(key,o)}};
  for(const[k,v]of active()){add(v.bids,"b");add(v.asks,"s")}return [...out.values()];
}
function mix(t){const a=[47,107,255],b=[255,212,0];return a.map((c,i)=>Math.round(c+(b[i]-c)*t))}

function draw(){
  requestAnimationFrame(draw);drawLiq();
  try{
    const w=ov.clientWidth,h=ov.clientHeight;
    const top=candles.coordinateToPrice(0),bot=candles.coordinateToPrice(h*0.7);
    if(top==null||bot==null||!Object.keys(book).length)return;
    const sig=[w,h,top.toFixed(2),bot.toFixed(2),ver,spot.checked,fut.checked,Object.values(on).join("")].join("|");
    if(sig===lastSig)return;lastSig=sig;
    lastStep=Math.max(.5,niceStep(Math.abs(top-bot)/60));cache=buckets(lastStep);ctx.clearRect(0,0,w,h);
    const ps=chart.priceScale("right"),axW=(ps.width&&ps.width())||60,cw=w-axW;
    ctx.save();ctx.beginPath();ctx.rect(0,0,cw,h*.7);ctx.clip();
    const vis=cache.filter(b=>b.p+lastStep>=bot&&b.p<=top);let max=1e-9;for(const b of vis)if(b.v>max)max=b.v;
    for(const b of vis){const y1=candles.priceToCoordinate(b.p+lastStep),y2=candles.priceToCoordinate(b.p);if(y1==null||y2==null)continue;
      const t=Math.sqrt(b.v/max),[r,g,bl]=mix(t),hh=Math.max(3,y2-y1-1),len=Math.max(8,t*cw*.45);
      ctx.fillStyle=`rgba(${r},${g},${bl},.10)`;ctx.fillRect(0,y1,cw,hh);ctx.fillStyle=`rgba(${r},${g},${bl},.92)`;ctx.fillRect(cw-len,y1,len,hh);
      ctx.fillStyle=b.side==="b"?"#26a69a":"#ef5350";ctx.fillRect(cw-len-3,y1,3,hh);
      if(hh>=11&&t>.3){ctx.fillStyle="#fff";ctx.font="11px system-ui";ctx.textAlign="right";ctx.fillText(b.v.toFixed(1)+" BTC",cw-len-7,y1+hh/2+4)}}
    ctx.restore();
  }catch(e){st("Zeichenfehler: "+e.message)}
}

function buildLiq(){liq=null;const n=bars.length;if(n<10)return;const T=[[5,.12],[10,.25],[25,.28],[50,.22],[100,.13]],MM=.004;let lo=1e12,hi=0;
  for(const b of bars){if(b.l<lo)lo=b.l;if(b.h>hi)hi=b.h}const last=bars[n-1].c;lo=Math.max(1,lo*.85);hi*=1.15;
  const step=Math.max(niceStep(last*.0015),niceStep((hi-lo)/500)),pLo=Math.floor(lo/step)*step,R=Math.ceil((hi-pLo)/step)+1;
  const W=n+1,d=new Float32Array(R*W),tau=n*.4,sh=lsRatio>0?lsRatio/(1+lsRatio):.5;let tot=0;
  for(let i=0;i<n-1;i++){const b=bars[i],e=(b.h+b.l+b.c)/3,w0=b.v*Math.exp(-(n-1-i)/tau);
    for(const[L,tw]of T)for(const s of[0,1]){const lp=s?e*(1+1/L-MM):e*(1-1/L+MM),v=w0*tw*(s?1-sh:sh);let j=i+1;
      if(s){while(j<n&&bars[j].h<lp)j++}else{while(j<n&&bars[j].l>lp)j++}const r=Math.floor((lp-pLo)/step);
      if(r<0||r>=R)continue;d[r*W+i+1]+=v;d[r*W+j]-=v;if(j===n)tot+=v}}
  const k=oi&&tot>0?oi/tot:1,g=new Float32Array(R*n);let max=0;
  for(let r=0;r<R;r++){let a=0;for(let c=0;c<n;c++){a+=d[r*W+c];const v=a*k;g[r*n+c]=v;if(v>max)max=v}}
  liq={g,R,n,pLo,step,max:max||1,unit:oi?"BTC":"rel"};liqVer++;lastSig2="";
}
const NL=20,LC=[null];for(let l=1;l<=NL;l++){const t=l/NL,m=mix(t);LC.push(`rgba(${m[0]},${m[1]},${m[2]},${.22+.7*t})`)}
function drawLiq(){try{if(!liq)return;const w=ov2.clientWidth,h=ov2.clientHeight,ts=chart2.timeScale(),lr=ts.getVisibleLogicalRange();
  const top=line2.coordinateToPrice(0),bot=line2.coordinateToPrice(h-30);if(!lr||top==null||bot==null)return;
  const sig=[w,h,top.toFixed(1),bot.toFixed(1),lr.from.toFixed(2),lr.to.toFixed(2),liqVer].join("|");if(sig===lastSig2)return;lastSig2=sig;
  ctx2.clearRect(0,0,w,h);const ps=chart2.priceScale("right"),axW=(ps.width&&ps.width())||60,cw=w-axW,ph=h-((ts.height&&ts.height())||28);
  const{g,R,n,pLo,step,max}=liq,X=ts.logicalToCoordinate?c=>ts.logicalToCoordinate(c):c=>ts.timeToCoordinate(bars[Math.min(c,n-1)].t);
  const c0=Math.max(0,Math.floor(lr.from)-1),c1=Math.min(n-1,Math.ceil(lr.to)+1);if(c1<=c0)return;const xs=[];for(let c=c0;c<=c1;c++)xs[c]=X(c);
  const sp=xs[c0+1]-xs[c0];ctx2.save();ctx2.beginPath();ctx2.rect(0,0,cw,ph);ctx2.clip();const r0=Math.max(0,Math.floor((bot-pLo)/step)),r1=Math.min(R-1,Math.ceil((top-pLo)/step)),thr=max*.004;
  for(let r=r0;r<=r1;r++){const y1=line2.priceToCoordinate(pLo+(r+1)*step),y2=line2.priceToCoordinate(pLo+r*step);if(y1==null||y2==null)continue;
    const hh=y2-y1+.7;let cur=0,xa=0;for(let c=c0;c<=c1+1;c++){let lv=0;if(c<=c1){const v=g[r*n+c];lv=v>thr?1+Math.floor(Math.min(1,Math.sqrt(v/max))*(NL-1)):0}
      if(lv!==cur){if(cur){const xe=(c>c1&&c1===n-1)?cw:xs[c-1]+sp/2;ctx2.fillStyle=LC[cur];ctx2.fillRect(xa,y1,xe-xa,hh)}cur=lv;xa=c<=c1?xs[c]-sp/2:0}}}
  ctx2.restore();}catch(e){st("Liq-Fehler: "+e.message)}}

chart2.subscribeCrosshairMove(p=>{const el=$("liqhover");if(!liq||!p.point||p.time==null){el.textContent="";return}const c=tIdx.get(p.time),pr=line2.coordinateToPrice(p.point.y);if(c==null||pr==null){el.textContent="";return}
  const r=Math.floor((pr-liq.pLo)/liq.step),v=r>=0&&r<liq.R?liq.g[r*liq.n+c]:0,f=x=>Math.round(x).toLocaleString("de-DE");el.textContent=v>0?`${pr<bars[c].c?"Long":"Short"}-Liquidationen $${f(liq.pLo+r*liq.step)}–${f(liq.pLo+(r+1)*liq.step)} · ${liq.unit==="BTC"?v.toFixed(0)+" BTC":"rel. "+(100*v/liq.max).toFixed(0)+" %"}`:""});

chart.subscribeCrosshairMove(p=>{const el=$("hover");if(!p.point||!cache.length){el.textContent="";return}const pr=candles.coordinateToPrice(p.point.y);const b=pr!=null&&cache.find(x=>pr>=x.p&&pr<x.p+lastStep);el.textContent=b?`${b.side==="b"?"Kauf":"Verkauf"}wand $${b.p.toLocaleString("de-DE")} · ${b.v.toFixed(1)} BTC · ≈ $${Math.round(b.v*b.p).toLocaleString("de-DE")}`:""});

const tfBox=$("tf");Object.keys(TFS).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{tf=k;[...tfBox.children].forEach(c=>c.classList.toggle("on",c===b));loadHistory()};if(k===tf)b.classList.add("on");tfBox.appendChild(b)});
$("ls").onchange=e=>Object.values(lsS).forEach(s=>s.applyOptions({visible:e.target.checked}));spot.onchange=fut.onchange=refresh;fok.onchange=view;

const row=$("exrow"),chips={};Object.keys(EX).forEach(k=>{const c=document.createElement("span");c.className="chip on";c.title=Object.keys(EX[k]).map(m=>m==="spot"?"Spot":"Futures").join(" + ");c.innerHTML=`<i class="dot"></i>${k}`;c.onclick=()=>{on[k]=!on[k];c.classList.toggle("on",on[k]);refresh()};row.appendChild(c);chips[k]=c});
function paintChips(){for(const k in chips)chips[k].firstChild.className="dot "+(ok[k]===true?"ok":ok[k]===false?"bad":"")}

paintLS();resize();loadHistory();loadBook();draw();setInterval(loadBook,10000);setInterval(()=>{if(tf==="15m"||tf==="1h")loadHistory()},300000);
</script>
